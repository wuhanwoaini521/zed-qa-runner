[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zedqa"
version = "0.1.0"
description = "Zed QA Runner: pytest + Playwright test explorer, scheduler, runner and Allure reporting for Zed"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "zed-qa-runner" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.80",
    "pydantic>=2.7",
    "tomli-w>=1.0",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "pytest-rerunfailures>=14.0",
    "allure-pytest>=2.13",
]

[project.optional-dependencies]
playwright = ["playwright>=1.45"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-timeout>=2.3",
    "playwright>=1.45",
]

[project.scripts]
zedqa = "zedqa.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/zedqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: slow tests",
    "e2e: end to end tests",
    "requires_playwright: tests that need a real browser",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
